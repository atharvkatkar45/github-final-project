
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean the workspace before running tests.
  steps:
    - name: cleanup
      image: alpine:3.20
      script: |
        #!/bin/sh
        echo "Cleanup task completed"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  description: Run Python unit tests using nose.
  steps:
    - name: run-tests
      image: python:3.11
      script: |
        #!/bin/sh
        pip install nose
        nosetests
